<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Cohetes 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="reader" id="reader" aria-label="Revista Cohetes 2026">
    <div class="fireworks fireworks-one" aria-hidden="true"></div>
    <div class="fireworks fireworks-two" aria-hidden="true"></div>
    <div class="fireworks fireworks-three" aria-hidden="true"></div>

    <button class="nav-button previous" id="prev" type="button" aria-label="Página anterior" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <section class="book-area" aria-label="Lector de revista">
      <div class="book" id="book"></div>
      <div class="loading" id="loading">Cargando revista…</div>
    </section>

    <button class="nav-button next" id="next" type="button" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <div class="page-counter" aria-live="polite">
      <span id="page-current">1</span><span class="divider">/</span><span id="page-total">6</span>
    </div>
  </main>
</body>
</html>
